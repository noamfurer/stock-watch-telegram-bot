name: Migrate bot to Netlify

on:
  push:
    paths:
      - ".github/workflows/migrate-to-netlify.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
      ALERT_THRESHOLD_PERCENT: ${{ secrets.ALERT_THRESHOLD_PERCENT }}

    steps:
      - name: Check out encrypted state
        uses: actions/checkout@v4

      - name: Transfer private configuration and state
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=stock-watch-telegram-bot-migration")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          payload="$(jq -n \
            --arg token "$TELEGRAM_BOT_TOKEN" \
            --arg watchlist "$WATCHLIST_JSON" \
            --arg threshold "$ALERT_THRESHOLD_PERCENT" \
            --rawfile legacyState runtime_state.enc \
            '{token:$token,watchlistJson:$watchlist,threshold:$threshold,legacyState:$legacyState}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $oidc_token" \
            --data "$payload" \
            https://stock-watch-telegram-bot.netlify.app/api/migrate
