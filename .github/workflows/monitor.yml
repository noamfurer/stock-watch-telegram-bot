name: Stock monitor

on:
  schedule:
    # Primary runs avoid the beginning of the hour, when GitHub Actions is busiest.
    # Backup runs start five minutes later and skip market work after a recent success.
    # Telegram subscriptions are processed all day. Market data is requested only
    # Monday-Friday, 10:00-18:00 in Asia/Jerusalem.
    - cron: "7,22,37,52 * * * *"
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SETUP_CODE: ${{ secrets.TELEGRAM_SETUP_CODE }}
      WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
      ALERT_THRESHOLD_PERCENT: ${{ secrets.ALERT_THRESHOLD_PERCENT }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      FORCE_MONITOR_RUN: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python stock_bot.py

      - name: Persist encrypted notification state
        if: always()
        run: |
          if [ ! -f runtime_state.enc ]; then
            exit 0
          fi
          if git diff --quiet -- runtime_state.enc && git ls-files --error-unmatch runtime_state.enc >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_state.enc
          git commit -m "Update encrypted monitor state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
