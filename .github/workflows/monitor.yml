name: Stock monitor

on:
  schedule:
    # GitHub cron is UTC. The Python process applies Asia/Jerusalem time and exits
    # outside Monday-Friday, 10:00-18:00, including daylight-saving changes.
    - cron: "*/15 7-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SETUP_CODE: ${{ secrets.TELEGRAM_SETUP_CODE }}
      WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
      ALERT_THRESHOLD_PERCENT: ${{ secrets.ALERT_THRESHOLD_PERCENT }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python stock_bot.py

      - name: Persist encrypted notification state
        run: |
          if [ ! -f runtime_state.enc ]; then
            exit 0
          fi
          if git diff --quiet -- runtime_state.enc && git ls-files --error-unmatch runtime_state.enc >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_state.enc
          git commit -m "Update encrypted monitor state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
