name: Process Telegram administration once

on:
  push:
    paths:
      - ".github/workflows/process-telegram-once.yml"

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_SETUP_CODE: ${{ secrets.TELEGRAM_SETUP_CODE }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python stock_bot.py
      - name: Persist encrypted subscriber state
        if: always()
        run: |
          if [ ! -f runtime_state.enc ]; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_state.enc
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Process encrypted Telegram administration"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
